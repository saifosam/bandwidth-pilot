<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3b6e"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1a6"/>
      <stop offset="0.55" stop-color="#4cc9ff"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#4cc9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4cc9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="128" cy="150" r="110" fill="url(#glow)" clip-path="url(#tile)"/>
  <!-- gauge arc: 210deg sweep around (128,150), r=78 -->
  <path d="M 60.45 189 A 78 78 0 1 1 195.55 189" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round" filter="url(#soft)" opacity="0.6"/>
  <path d="M 60.45 189 A 78 78 0 1 1 195.55 189" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"/>
  <!-- ticks -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round">
    <line x1="78.5" y1="121.4" x2="88" y2="127"/>
    <line x1="128" y1="92" x2="128" y2="103"/>
    <line x1="177.5" y1="121.4" x2="168" y2="127"/>
  </g>
  <!-- needle pointing up-right -->
  <path d="M 120 158 L 184 96 L 136 166 Z" fill="url(#needle)" filter="url(#soft)" opacity="0.7"/>
  <path d="M 120 158 L 184 96 L 136 166 Z" fill="url(#needle)"/>
  <circle cx="128" cy="160" r="15" fill="#ffffff"/>
  <circle cx="128" cy="160" r="6" fill="#0a1428"/>
</svg>
